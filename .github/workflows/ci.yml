name: ci

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - run: make test

  # Real-kernel tests. Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which would hide
  # exactly the isolation these tests exist to check, so the restriction is lifted for the test run only.
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Load the tun driver
        run: sudo modprobe tun || true
      - name: Start a systemd user manager (the resource limit tests skip without one)
        run: |
          sudo loginctl enable-linger "$USER" || true
          sudo systemctl start "user@$(id -u).service" || true
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - run: make security
      - name: Canaries (host assumptions)
        run: make canary
